name: Pages

# Builds the GitHub Pages edition of LifeOps (https://gopalinternship-unibasel.github.io/lifeops-ai/)
# and publishes it with the GitHub Pages actions. It runs on demand only: `npm run release:pages`
# deploys the Supabase Edge Function "lifeops-api" (the server side) and then starts this workflow
# on main with the input `sha` set to the commit it deployed, so both halves come from one commit
# even when main moves on in the meantime (see PAGES_DEPLOYMENT.md). Started by hand without `sha`,
# it builds the head of main. The commit must be on main: the github-pages environment publishes
# from main only.
# The build reads the public Supabase values from the repository variables SUPABASE_URL and
# SUPABASE_PUBLISHABLE_KEY (also used by smoke.yml); PAGES_SERVER_FN_ORIGIN may override the
# function's URL.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit to build: a full 40-character SHA on main (empty: the head of the branch)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check settings
        env:
          URL: ${{ vars.SUPABASE_URL }}
          KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::Set the repository variables SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY (see PAGES_DEPLOYMENT.md)."
            exit 1
          fi

      - name: Check the commit input
        env:
          SHA: ${{ inputs.sha }}
        run: |
          if [ -n "$SHA" ] && ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::The input sha must be a full 40-character commit SHA in lower case."
            exit 1
          fi

      # The released commit, not whatever the branch points to when the run starts. Full history,
      # so the next step can check that the commit is on main.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0

      - name: The commit is on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Commit $(git rev-parse --short HEAD) is not on main. The Pages site is published from main only; merge first."
            exit 1
          fi
          echo "Building $(git rev-parse HEAD)."

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (client files only)
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          PAGES_SERVER_FN_ORIGIN: ${{ vars.PAGES_SERVER_FN_ORIGIN }}
          VITE_ENABLE_ANONYMOUS_DEMO: "true"
          VITE_ENABLE_GOOGLE_SIGNIN: "false"
          VITE_HOSTED_DEMO: "true"
        run: |
          export VITE_SERVER_FN_ORIGIN="${PAGES_SERVER_FN_ORIGIN:-${VITE_SUPABASE_URL%/}/functions/v1/lifeops-api}"
          node scripts/pages/build.mjs --client

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-pages/client

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
